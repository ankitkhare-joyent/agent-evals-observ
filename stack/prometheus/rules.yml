# Agent SLO alerts. Metric names come from the Collector's spanmetrics connector (namespace "agent")
# and from the GenAI metrics our instrumentation emits. docs/09-online-evals-and-monitoring.md explains them.
groups:
  - name: agent-slos
    rules:
      - alert: AgentToolErrorRateHigh
        expr: |
          sum(rate(agent_calls_total{gen_ai_operation_name="execute_tool", status_code="STATUS_CODE_ERROR"}[10m]))
            / clamp_min(sum(rate(agent_calls_total{gen_ai_operation_name="execute_tool"}[10m])), 1e-9) > 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "More than 10% of agent tool calls are failing"

      - alert: AgentRunLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(agent_duration_milliseconds_bucket{gen_ai_operation_name="invoke_agent"}[15m]))) > 60000
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "p95 end-to-end agent run time is above 60s"

      - alert: AgentTokenBurnSpike
        expr: |
          sum(rate(gen_ai_client_token_usage_sum[30m])) > 3 * sum(rate(gen_ai_client_token_usage_sum[6h] offset 1d))
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Token consumption is 3x the same time yesterday (prompt regression, loop, or abuse?)"
